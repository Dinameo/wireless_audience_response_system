<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>{{ session.name }}</title>
<style>body{font-family:Arial;max-width:1200px;margin:30px auto}.q{border:1px solid #ccc;border-radius:10px;padding:15px;margin:12px 0}button{padding:8px 12px}table{border-collapse:collapse;width:100%;margin-top:15px}th,td{border:1px solid #ddd;padding:7px}.counts{font-size:22px;margin:16px 0}</style></head>
<body>
<h1>{{ session.name }}</h1><p>Session ID: <b>{{ session.id }}</b></p>
{% for q in questions %}
<div class="q"><h3>?{{ q.number }} {{ q.text }}</h3>
<p>A. {{ q.option_a }}</p><p>B. {{ q.option_b }}</p><p>C. {{ q.option_c }}</p><p>D. {{ q.option_d }}</p>
<button onclick="openQuestion({{ q.number }})">Mở câu {{ q.number }}</button></div>
{% endfor %}
<hr><h2>Live answers</h2><div id="current">Chưa mở câu hỏi.</div><div class="counts" id="counts"></div>
<table><thead><tr><th>STT</th><th>MSSV</th><th>Họ tên</th><th>Remote</th><th>Đáp án</th><th>Đúng?</th></tr></thead><tbody id="rows"></tbody></table>
<script>
let currentQuestion=null; const sessionId={{ session.id }};
async function openQuestion(q){
 const r=await fetch(`/api/session/${sessionId}/question/${q}/open`,{method:"POST"});
 if(!r.ok){alert(await r.text());return}
 currentQuestion=q; document.getElementById("current").textContent=`Đang mở câu ${q}`; await refreshAnswers();
}
async function refreshAnswers(){
 if(currentQuestion===null)return;
 const r=await fetch(`/api/session/${sessionId}/answers/${currentQuestion}`); if(!r.ok)return;
 const d=await r.json();
 document.getElementById("counts").textContent=`A=${d.counts.A} | B=${d.counts.B} | C=${d.counts.C} | D=${d.counts.D}`;
 const tbody=document.getElementById("rows"); tbody.innerHTML="";
 for(const s of d.students){
  const tr=document.createElement("tr");
  tr.innerHTML=`<td>${s.stt}</td><td>${s.mssv}</td><td>${s.ho_ten}</td><td>${s.remote_no}</td><td>${s.answer}</td><td>${s.correct?"✓":"✗"}</td>`;
  tbody.appendChild(tr);
 }
}
setInterval(refreshAnswers,1000);
</script></body></html>
